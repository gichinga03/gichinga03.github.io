name: Build writeups index

on:
  push:
    branches: [main]
    paths:
      - "writeups/**"
      - "azure-writeups/**"
      - "scripts/build-writeups.js"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate writeups.json
        run: node scripts/build-writeups.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add writeups.json writeups azure-writeups
          git diff --staged --quiet || git commit -m "chore: rebuild writeups index + theme writeups [skip ci]"
          git push